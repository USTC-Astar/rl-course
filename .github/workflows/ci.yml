name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python 测试（pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 同步依赖并运行测试
        run: |
          uv sync --python 3.11
          uv run -m pytest -q

  web-build:
    name: 网站构建（VitePress）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖并构建
        run: |
          npm ci
          npm run build

      - name: 抽查构建产物
        run: |
          test -f dist/index.html
          test -f dist/lesson00/index.html
          test -f dist/lesson21/index.html
          test -f dist/reference/glossary.html
          test -f dist/data/foundations.json
          test -f dist/data/debug_lessons.json
