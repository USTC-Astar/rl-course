[project]
name = "rl-learning-lab"
version = "0.2.0"
description = "面向零基础学习者的强化学习本地训练与 HTML 可视化课程"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium[classic-control,mujoco]>=1.3.0,<2",
    "numpy>=1.26,<3",
    "torch>=2.4,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
